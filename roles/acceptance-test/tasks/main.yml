---
- name: Create databases for sites
  mysql_db:
    name: "tests"
    state: present
    login_host: "localhost"
    login_user: "root"
    login_password: "devpw"

- name: Create/assign database root user to db and grant permissions
  mysql_user:
    name: "root"
    password: "devpw"
    host: "localhost"
    append_privs: yes
    priv: "tests.*:ALL"
    state: present
    login_host: "localhost"
    login_user: "root"
    login_password: "devpw"

- name: Create/assign database pressbooks_test user to db and grant permissions
  mysql_user:
    name: "pressbooks_test"
    password: "example_dbpassword"
    host: "localhost"
    append_privs: yes
    priv: "tests.*:ALL"
    state: present
    login_host: "localhost"
    login_user: "root"
    login_password: "devpw"

- name: Install Chromium
  apt:
    name: chromium-browser
    state: present

- name: Install Chromium Chrome Driver
  apt:
    name: chromium-chromedriver
    state: present

- name: Check that the chromedriver exists
  stat:
    path: /usr/bin/chromedriver
  register: chromedriver_present

